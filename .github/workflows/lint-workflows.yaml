name: Lint workflows

# Reusable: zizmor and actionlint over the calling repository's workflows, from its devenv
# (the platform-kit devenv module provides both).
#
# Caller permissions: contents: read.

on:
  workflow_call: {}

permissions: {}

env:
  DEVENV_VERSION: v2.4.0

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: devenv shell -- actionlint

      # Online audits (pinned refs, known-vulnerable actions) need a token to query the GitHub API.
      - name: zizmor
        run: devenv shell -- zizmor --format=github .
        env:
          GH_TOKEN: ${{ github.token }}
