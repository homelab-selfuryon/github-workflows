name: App release

# Reusable: releases an app from a `v*` tag and moves staging in gitops.
#
#   image     ghcr.io/homelab-selfuryon/<app>:<version>  (from the Containerfile; buildx SBOM and
#             provenance (mode=max); cosign signed)
#   manifests ghcr.io/homelab-selfuryon/<app>/manifests:<version>  (staging/ and prod/ renders, cosign signed)
#   PR        gitops: apps/<team>/<app>/staging.json -> {version, digest}, auto-merge enabled
#
# SBOM and provenance are the buildx attestations inside the image index; the cosign signature of
# the index digest covers them, with this workflow's identity. actions/attest-build-provenance is not
# used: it would add a second, GitHub-signed provenance statement of the same build, made by the same
# job, that nothing in the delivery chain verifies.
#
# The job runs in the GitHub Environment `staging` of the calling repository (deployment rule:
# tags `v*` only). The environment is part of the OIDC subject, which is what octo-sts checks
# before it issues a token for gitops.
#
# Caller permissions: contents: read, packages: write, id-token: write.

on:
  workflow_call: {}

permissions: {}

env:
  DEVENV_VERSION: v2.4.0
  CUE_REGISTRY: 'inline:moduleRegistries: "github.com/homelab-selfuryon": {registry: "ghcr.io/homelab-selfuryon/cue", stripPrefix: true}'
  REGISTRY: ghcr.io/homelab-selfuryon

jobs:
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    environment: staging
    permissions:
      contents: read
      packages: write # push image and manifests
      id-token: write # keyless cosign, octo-sts
    concurrency:
      group: app-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag must be reachable from main
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"

      # ~/.docker/config.json: read by buildx, oras and cue (platform-kit comes from GHCR).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      - name: Resolve and validate the release
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag is not a semantic version"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main || { echo "::error::the tag is not on main"; exit 1; }
          app=$(devenv shell -- cue export ./deploy -e name --out text)
          team=$(devenv shell -- cue export ./deploy -e team --out text)
          [[ "$app" =~ ^[a-z][a-z0-9-]{1,40}$ ]] || { echo "::error::invalid app name"; exit 1; }
          [[ "$team" =~ ^[a-z][a-z0-9-]{1,30}$ ]] || { echo "::error::invalid team name"; exit 1; }
          [[ "$app" == "${GITHUB_REPOSITORY#*/}" ]] || { echo "::error::deploy.cue name does not match the repository"; exit 1; }
          {
            echo "APP=$app"
            echo "TEAM=$team"
          } >> "$GITHUB_ENV"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.APP }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true

      - name: Sign the image
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${REGISTRY}/${APP}@${DIGEST}"
          echo "IMAGE_DIGEST=${DIGEST}" >> "$GITHUB_ENV"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Render staging and prod
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/manifests"
          for env in staging prod; do
            cat > deploy/context_gen.cue <<CUE
          package deploy

          context: {
          	env:     "${env}"
          	image:   "${REGISTRY}/${APP}@${IMAGE_DIGEST}"
          	version: "${VERSION}"
          }
          CUE
            mkdir -p "$out/$env"
            devenv shell -- cue export ./deploy -e manifestsYAML --out text > "$out/$env/manifests.yaml"
            [[ -s "$out/$env/manifests.yaml" ]]
          done
          rm deploy/context_gen.cue
          # Deterministic tarball: same input, same digest.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$out" -cf - prod staging | gzip -n > "$RUNNER_TEMP/manifests.tar.gz"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Push and sign the manifests
        run: |
          set -euo pipefail
          # Relative file name: oras records it as the layer title.
          (cd "$RUNNER_TEMP" && oras push "${REGISTRY}/${APP}/manifests:${VERSION}" \
            --artifact-type application/vnd.homelab-selfuryon.manifests.v1 \
            --format json \
            "manifests.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip") > "$RUNNER_TEMP/push.json"
          digest=$(jq -r .digest "$RUNNER_TEMP/push.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${REGISTRY}/${APP}/manifests@${digest}"
          echo "MANIFESTS_DIGEST=${digest}" >> "$GITHUB_ENV"
        env:
          VERSION: ${{ github.ref_name }}

      # Token for gitops only now, so it lives as short as possible.
      - name: Token for gitops
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: homelab-selfuryon/gitops
          identity: app-release

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: homelab-selfuryon/gitops
          path: gitops
          token: ${{ steps.octo-sts.outputs.token }}
          persist-credentials: false

      - name: Move staging
        run: |
          set -euo pipefail
          file="gitops/apps/${TEAM}/${APP}/staging.json"
          [[ -d "gitops/apps/${TEAM}/${APP}" ]] || { echo "::error::${APP} is not registered in gitops (apps/${TEAM}/${APP})"; exit 1; }
          jq -n --arg version "$VERSION" --arg digest "$MANIFESTS_DIGEST" '{version: $version, digest: $digest}' > "$file"
          echo "BODY_FILE=$RUNNER_TEMP/pr-body.md" >> "$GITHUB_ENV"
          {
            echo "Release \`${VERSION}\` of \`${APP}\` to staging."
            echo
            echo "- manifests: \`${REGISTRY}/${APP}/manifests@${MANIFESTS_DIGEST}\`"
            echo "- image: \`${REGISTRY}/${APP}@${IMAGE_DIGEST}\`"
            echo "- source: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${VERSION}"
            echo "- workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > "$RUNNER_TEMP/pr-body.md"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Open the PR
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: gitops
          token: ${{ steps.octo-sts.outputs.token }}
          branch: release/${{ env.APP }}/staging/${{ github.ref_name }}
          sign-commits: true
          delete-branch: true
          add-paths: apps/${{ env.TEAM }}/${{ env.APP }}/staging.json
          title: "release(${{ env.APP }}): staging ${{ github.ref_name }}"
          commit-message: "release(${{ env.APP }}): staging ${{ github.ref_name }}"
          body-path: ${{ env.BODY_FILE }}

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "$PR"
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GH_REPO: homelab-selfuryon/gitops
          PR: ${{ steps.pr.outputs.pull-request-number }}
