name: App preview

# Reusable: builds a preview of an app for one pull request.
#
#   image     ghcr.io/homelab-selfuryon/<app>:pr-<n>-<sha7>  (from the Containerfile, buildx SBOM and
#             provenance, cosign signed)
#   manifests ghcr.io/homelab-selfuryon/<app>/manifests:pr-<n>  (preview/manifests.yaml, cosign signed)
#
# The Argo CD ApplicationSet in gitops creates the environment per open PR. The signature carries
# this workflow's identity (app-preview.yaml), which gitops and Flux never accept for staging or prod.
#
# Runs only for pull requests from the same repository: a fork must not get a token that can push.
# Caller permissions: contents: read, packages: write, id-token: write.

on:
  workflow_call: {}

permissions: {}

env:
  DEVENV_VERSION: v2.4.0
  CUE_REGISTRY: 'inline:moduleRegistries: "github.com/homelab-selfuryon": {registry: "ghcr.io/homelab-selfuryon/cue", stripPrefix: true}'
  REGISTRY: ghcr.io/homelab-selfuryon

jobs:
  preview:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push image and manifests
      id-token: write # keyless cosign signing
    concurrency:
      group: app-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: devenv # read-only: the public devenv cache, no auth token
      - name: Install devenv
        run: |
          nix profile install --accept-flake-config --profile "$RUNNER_TEMP/devenv" "github:cachix/devenv/${DEVENV_VERSION}#devenv"
          echo "$RUNNER_TEMP/devenv/bin" >> "$GITHUB_PATH"

      # ~/.docker/config.json: read by buildx, oras and cue (platform-kit comes from GHCR).
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3

      # The app name decides where artifacts land: it must be the repository's own name.
      - name: Resolve and validate the app
        run: |
          set -euo pipefail
          app=$(devenv shell -- cue export ./deploy -e name --out text)
          team=$(devenv shell -- cue export ./deploy -e team --out text)
          [[ "$app" =~ ^[a-z][a-z0-9-]{1,40}$ ]] || { echo "::error::invalid app name"; exit 1; }
          [[ "$team" =~ ^[a-z][a-z0-9-]{1,30}$ ]] || { echo "::error::invalid team name"; exit 1; }
          [[ "$app" == "${GITHUB_REPOSITORY#*/}" ]] || { echo "::error::deploy.cue name does not match the repository"; exit 1; }
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "::error::invalid PR number"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::invalid head SHA"; exit 1; }
          {
            echo "APP=$app"
            echo "TAG=pr-${PR}-${HEAD_SHA::7}"
          } >> "$GITHUB_ENV"
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.APP }}:${{ env.TAG }}
          provenance: mode=max
          sbom: true

      # The digest is the one of the image index, which also lists the SBOM and provenance
      # attestations: signing it covers them.
      - name: Sign the image
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${REGISTRY}/${APP}@${DIGEST}"
          echo "IMAGE=${REGISTRY}/${APP}@${DIGEST}" >> "$GITHUB_ENV"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Render the preview manifests
        run: |
          set -euo pipefail
          cat > deploy/context_gen.cue <<CUE
          package deploy

          context: {
          	env:     "preview"
          	image:   "${IMAGE}"
          	version: "${TAG}"
          	pr:      ${PR}
          }
          CUE
          out="$RUNNER_TEMP/manifests"
          mkdir -p "$out/preview"
          devenv shell -- cue export ./deploy -e manifestsYAML --out text > "$out/preview/manifests.yaml"
          [[ -s "$out/preview/manifests.yaml" ]]
          # Deterministic tarball: same input, same digest.
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -C "$out" -cf - preview | gzip -n > "$RUNNER_TEMP/manifests.tar.gz"
        env:
          PR: ${{ github.event.pull_request.number }}

      - name: Push and sign the manifests
        run: |
          set -euo pipefail
          # Relative file name: oras records it as the layer title.
          (cd "$RUNNER_TEMP" && oras push "${REGISTRY}/${APP}/manifests:pr-${PR}" \
            --artifact-type application/vnd.homelab-selfuryon.manifests.v1 \
            --format json \
            "manifests.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip") > "$RUNNER_TEMP/push.json"
          digest=$(jq -r .digest "$RUNNER_TEMP/push.json")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "${REGISTRY}/${APP}/manifests@${digest}"
          echo "Preview manifests: ${REGISTRY}/${APP}/manifests@${digest}" >> "$GITHUB_STEP_SUMMARY"
        env:
          PR: ${{ github.event.pull_request.number }}
